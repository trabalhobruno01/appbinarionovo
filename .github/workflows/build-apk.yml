name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      netlify_url:
        description: 'URL HTTPS da aplicação na Netlify (ex: https://seu-app.netlify.app)'
        required: false
        default: ''

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/cli @capacitor/android

      - name: Generate Android project & sync Capacitor
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.netlify_url || vars.CAPACITOR_SERVER_URL }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android permissions for Camera, Gallery & WebView
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$MANIFEST"
          fi

      - name: Configure MainActivity WebView file & camera chooser support
        run: |
          MAIN_JAVA=$(find android/app/src/main/java -name "MainActivity.*" | head -n 1)
          echo "Detected MainActivity at: $MAIN_JAVA"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chartpulse-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
